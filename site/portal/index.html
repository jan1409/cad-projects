<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-i18n="portal.title">Parametric Models</title>
<!--site:icon-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Same tokens as the model pages (Gridfinity/web/app/index.html): steel paper, PETG blue, condensed display type. */
:root {
  --paper: #eef1f3;
  --panel: #f8fafb;
  --plate: #e3e9ef;      /* image well: a printer bed */
  --grid: #d2dbe6;       /* 42 mm baseplate lines in the image well */
  --ink: #17202a;
  --muted: #5a6571;
  --line: #cdd4db;
  --accent: #2357c6;
  --accent-ink: #ffffff;
  --signal: #b8700f;
  --ok: #2e7d4f;
  --err: #b3261e;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #101418; --panel: #161b21; --plate: #1b222a; --grid: #26313d; --ink: #e3e8ee; --muted: #93a0ad; --line: #2a323b;
    --accent: #6e98f0; --accent-ink: #0d1220; --signal: #e0a548; --ok: #5dbb83; --err: #f2867c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #101418; --panel: #161b21; --plate: #1b222a; --grid: #26313d; --ink: #e3e8ee; --muted: #93a0ad; --line: #2a323b;
  --accent: #6e98f0; --accent-ink: #0d1220; --signal: #e0a548; --ok: #5dbb83; --err: #f2867c; color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap {
  max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px;
  padding-block: 40px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.label { font: 600 .8rem/1.2 var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
header { display: flex; flex-direction: column; gap: 8px; }
h1 { font: 700 2.6rem/1 var(--display); letter-spacing: .01em; text-transform: uppercase; margin: 0; text-wrap: balance; hyphens: auto; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.lang { display: inline-flex; flex: none; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.lang button { border: 0; background: none; color: var(--muted); padding: 3px 9px; font: 600 .78rem var(--body); letter-spacing: .04em; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.lede { margin: 0; color: var(--muted); max-width: 60ch; }
.models { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 20px; }
.card {
  display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
  overflow: hidden; color: inherit; text-decoration: none; transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.plate {
  aspect-ratio: 16 / 10; max-width: 100%; padding: 16px;
  background-color: var(--plate);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 42px 42px; background-position: -1px -1px;
}
.plate img { display: block; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 14px rgb(0 0 0 / .18)); }
.card-body { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px 18px; flex: 1; }
.card h2 { font: 700 1.5rem/1.05 var(--display); text-transform: uppercase; letter-spacing: .01em; margin: 0; text-wrap: balance; hyphens: auto; }
.card p { margin: 0; color: var(--muted); }
.facts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font: 400 .85rem/1.4 var(--mono); }
.facts li { display: flex; gap: 8px; }
.facts li::before { content: ""; flex: none; width: 6px; height: 6px; margin-top: .45em; border-radius: 1px; background: var(--accent); }
.open { margin-top: auto; padding-top: 6px; font: 700 1rem var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
.empty { color: var(--muted); }
footer { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); padding-top: 18px; }
.site { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 24px; }
.facts-row { display: flex; flex-wrap: wrap; gap: 4px 18px; font: 400 .85rem/1.5 var(--mono); color: var(--muted); min-width: 0; }
.facts-row b { font-weight: 500; color: var(--ink); }
.update { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.check {
  height: 36px; padding: 0 14px; border: 1px solid var(--accent); border-radius: 6px; background: none; color: var(--accent);
  font: 600 .9rem var(--body); cursor: pointer;
}
.check.primary { background: var(--accent); color: var(--accent-ink); }
.check:disabled { opacity: .55; cursor: progress; }
.check:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.msg { font-size: .9rem; color: var(--muted); }
.msg.ok { color: var(--ok); }
.msg.busy { color: var(--signal); }
.msg.err { color: var(--err); }
@media (max-width: 560px) { h1 { font-size: 2.1rem; } .wrap { padding-block: 24px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top"><div class="label" data-i18n="portal.kicker">CAD projects · print generators</div><div class="lang" data-lang-switch></div></div>
    <h1 data-i18n="portal.heading">Parametric models</h1>
    <p class="lede" data-i18n="portal.lede">Pick a model, set its size and download print-ready files. Every part is built in your browser with the OpenCascade kernel; nothing is uploaded.</p>
  </header>

  <main class="models" id="models" aria-label="Models" data-i18n-attr="aria-label:portal.models">
    <p class="empty" data-i18n="portal.loading">Loading models…</p>
  </main>

  <footer>
    <div class="site">
      <div class="facts-row" id="site-facts"><span><span data-i18n="portal.siteVersion">Site version</span> <b id="site-version">…</b></span></div>
      <div class="update" id="update" hidden>
        <span class="msg" id="update-msg" role="status" aria-live="polite"></span>
        <button class="check" id="check" type="button" data-i18n="update.check">Check for updates</button>
      </div>
    </div>
  </footer>
</div>
<script type="module" src="./portal.js"></script>
</body>
</html>
